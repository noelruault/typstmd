name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pinned, not latest: render assertions compare against a known compiler, and Typst's default font has changed between releases. Bump deliberately, with the fixtures.
      - name: Install typst, pandoc and poppler
        working-directory: .
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          curl -fsSLo /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
          typst --version && pandoc --version | head -1 && pdftotext -v 2>&1 | head -1
        env:
          TYPST_VERSION: 0.14.2
          PANDOC_VERSION: "3.9"

      - run: bun install --frozen-lockfile

      - run: bun test

      # Informational: absolute timings are machine-specific, so a laptop baseline cannot gate a CI runner. The committed baseline is the local gate.
      - run: bun run bench:report

      - run: bun run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

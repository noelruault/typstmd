<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>typstmd - Markdown to PDF</title>
  <style>
    /* --- CSS Custom Properties --- */
    :root {
      --bg-body: #f7f6ef;
      --bg-toolbar: #eeede4;
      --bg-panel: #f7f6ef;
      --bg-editor: #fbfaf4;
      --bg-preview: #e4e3da;
      --bg-hover: #e7e6dc;
      --bg-status-error: #fde2d3;

      --text-primary: #1d1f27;
      --text-secondary: #4b4f5c;
      --text-muted: #74788a;
      --text-status-error: #a33000;
      --text-status-loading: #1b5cc4;
      --text-link: #f54e00;
      --text-drop: #1b5cc4;

      --border-line: rgba(29, 31, 39, 0.16);
      --border-edge: rgba(29, 31, 39, 0.55);
      --border-drop: #2f80fa;

      --bg-drop-overlay: rgba(47, 128, 250, 0.08);

      --amber-1: #f0a32e;
      --amber-2: #e08e00;
      --amber-edge: #99621d;
      --blue: #2f80fa;
      --blue-edge: #1b5cc4;
      --green: #3faf5e;

      --check-border: #1d1f27;
      --check-fill: #fed7aa;
      --check-mark: #1d1f27;
    }

    body.dark {
      --bg-body: #23251f;
      --bg-toolbar: #1d1f19;
      --bg-panel: #2b2d26;
      --bg-editor: #1d1f19;
      --bg-preview: #161813;
      --bg-hover: #33352c;
      --bg-status-error: #4a1d0a;

      --text-primary: #ece9e0;
      --text-secondary: #b8b5a8;
      --text-muted: #8b8878;
      --text-status-error: #ffb597;
      --text-status-loading: #7aabff;
      --text-link: #ff7a3d;
      --text-drop: #7aabff;

      --border-line: rgba(236, 233, 224, 0.16);
      --border-edge: rgba(236, 233, 224, 0.45);
      --border-drop: #2f80fa;

      --bg-drop-overlay: rgba(47, 128, 250, 0.15);

      --check-border: #ece9e0;
      --check-fill: rgba(240, 163, 46, 0.22);
      --check-mark: #1d1f27;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      /* dvh tracks the viewport as mobile browser chrome collapses; 100vh alone measures the
         chrome-less height, so the status bar sits under the address bar on a phone. */
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg-body);
      color: var(--text-primary);
    }

    /* --- Toolbar --- */
    #toolbar {
      padding: 10px 16px;
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border-line);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #toolbar h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }
    .mark {
      width: 18px; height: 22px; flex: none;
      background: #fff;
      border: 2px solid #1d1f27;
      border-radius: 2px 7px 2px 2px;
      position: relative;
    }
    .mark::before {
      content: "";
      position: absolute; top: -2px; right: -2px;
      width: 7px; height: 7px;
      background: var(--amber-1);
      border: 2px solid #1d1f27;
      border-radius: 0 7px 0 4px;
    }
    .toolbar-spacer { flex: 1; }

    /* Three-step guide baked into the toolbar: 1 Write → 2 Pick a look → 3 Download */
    .steps {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .stepn {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--text-primary);
      color: var(--bg-toolbar);
      font-size: 11px;
      font-weight: 800;
      display: inline-grid;
      place-items: center;
      flex: none;
    }
    .arrow { color: var(--text-muted); font-weight: 400; }

    /* PostHog-style 3D buttons */
    .btn {
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      color: #1d1f27;
      padding: 6px 13px;
      border-radius: 8px;
      border: 1.5px solid var(--amber-edge);
      background: linear-gradient(180deg, var(--amber-1), var(--amber-2));
      box-shadow: 0 2.5px 0 var(--amber-edge);
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      display: inline-block;
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 0.5px 0 var(--amber-edge); }
    .btn[aria-disabled="true"] {
      opacity: 0.55;
      pointer-events: none;
    }
    .btn.sec {
      background: var(--bg-panel);
      color: var(--text-primary);
      border-color: var(--border-edge);
      box-shadow: 0 2.5px 0 var(--border-edge);
    }
    .btn.sec:active { box-shadow: 0 0.5px 0 var(--border-edge); }
    .btn.icon { padding: 6px 10px; font-size: 14px; line-height: 1.2; }
    select.btn { appearance: none; padding-right: 24px; }
    .select-wrap { position: relative; display: inline-flex; }
    .select-wrap::after {
      content: "▾";
      position: absolute;
      right: 9px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* --- Popovers (native details) --- */
    details.pop { position: relative; }
    details.pop > summary { list-style: none; cursor: pointer; }
    details.pop > summary::-webkit-details-marker { display: none; }
    details.pop[open] > summary .btn.sec { background: var(--bg-hover); }
    .panel {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      z-index: 20;
      min-width: 280px;
      background: var(--bg-panel);
      border: 1.5px solid var(--border-edge);
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(20, 30, 12, 0.28), 0 2.5px 0 var(--border-edge);
      padding: 12px 14px;
    }
    .panel h5 {
      margin: 10px 0 6px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .panel h5:first-child { margin-top: 0; }
    .prow {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 5px 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
    }
    /* Neo-brutalist checkbox: hard offset shadow, black border, rotated tick. */
    .brutal-check {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      width: 20px; height: 20px;
      flex: none;
      margin: 1px 0 0;
      cursor: pointer;
      background: var(--check-fill);
      border: 2px solid var(--check-border);
      border-radius: 4px;
      transition: box-shadow 0.1s, background 0.1s;
    }
    .brutal-check:hover { box-shadow: 2px 2px 0 var(--check-border); }
    .brutal-check:checked {
      background: var(--amber-1);
      box-shadow: 2px 2px 0 var(--check-border);
    }
    .brutal-check::after {
      content: "";
      position: absolute;
      left: 6px; top: 2px;
      width: 5px; height: 10px;
      border: solid var(--check-mark);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      opacity: 0;
    }
    .brutal-check:checked::after { opacity: 1; }
    .prow .hint { display: block; font-size: 11.5px; font-weight: 500; color: var(--text-muted); }
    .prow select {
      font: inherit;
      font-size: 12.5px;
      padding: 3px 8px;
      border-radius: 7px;
      border: 1.5px solid var(--border-edge);
      background: var(--bg-panel);
      color: var(--text-primary);
      margin-left: auto;
    }
    .pitem {
      display: block;
      width: 100%;
      text-align: left;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      background: none;
      border: none;
      border-radius: 8px;
      padding: 7px 8px;
      cursor: pointer;
    }
    .pitem:hover { background: var(--bg-hover); }
    .pitem .hint { display: block; font-size: 11.5px; font-weight: 500; color: var(--text-muted); }
    #onboard-agent { display: inline-flex; align-items: center; gap: 6px; position: relative; }
    #onboard-agent .agent-icons { display: inline-flex; align-items: center; gap: 5px; }
    #onboard-agent .agent-icons svg { height: 14px; width: auto; }
    .onboard-mobile { display: none; }
    /* Copy confirmation: swap the label for a checkmark that pops in, then reverts. */
    #onboard-agent.copied {
      background: #d7f0dd;
      border-color: #2e8f4e;
      box-shadow: 0 2.5px 0 #2e8f4e;
    }
    #onboard-agent.copied > span { visibility: hidden; }
    #onboard-agent.copied::after {
      content: "✓ Prompt copied";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #1e6b38;
      font-weight: 800;
      animation: copied-pop 0.28s ease;
    }
    @keyframes copied-pop { from { transform: scale(0.8); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }

    /* --- Editor pane tabs --- */
    #editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 1.5px solid var(--border-edge);
    }
    #pane-tabs {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      padding: 8px 12px 0;
      background: var(--bg-toolbar);
      border-bottom: 1.5px solid var(--border-edge);
    }
    .tab {
      font: inherit;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-secondary);
      background: transparent;
      border: 1.5px solid transparent;
      border-bottom: none;
      border-radius: 9px 9px 0 0;
      padding: 7px 14px 8px;
      cursor: pointer;
    }
    .tab:hover { color: var(--text-primary); background: var(--bg-hover); }
    .tab.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue-edge);
      box-shadow: inset 0 -3px 0 rgba(255, 255, 255, 0.35);
    }
    .tab-actions {
      margin-left: auto;
      display: flex;
      gap: 6px;
      padding-bottom: 6px;
    }
    .tab-actions .btn { font-size: 11.5px; padding: 3px 10px; box-shadow: 0 2px 0 var(--border-edge); }
    .tab-actions .btn:active { box-shadow: 0 0.5px 0 var(--border-edge); }
    .tab-actions select.btn { appearance: none; padding-right: 22px; max-width: 130px; }
    /* "Enter = new line" is a Markdown-parsing option, so its Document section shows only on the Markdown view. */
    #hardbreaks-action { display: none; }
    #hardbreaks-action.visible { display: block; }
    #edit-template { display: none; }
    #edit-template.visible { display: inline-block; }
    #reset-template {
      display: none;
      border-color: #c2410c;
      box-shadow: 0 2px 0 #c2410c;
      color: #c2410c;
    }
    #reset-template.visible { display: inline-block; }

    /* --- CodeMirror editor host --- */
    #editor-host {
      flex: 1;
      overflow: hidden;
    }
    #editor-host .cm-editor { height: 100%; }
    #editor-host .cm-scroller {
      overflow: auto;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: 13px;
    }

    /* --- Layout --- */
    #main {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    #preview-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }
    #preview-max { display: none; }
    /* The preview is an SVG we render ourselves (see svg-preview.ts), not the browser's PDF
       viewer, so it scrolls on every platform, phones included. The SVG carries its own page
       backgrounds; the container supplies the desk behind them. */
    #preview {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: var(--bg-preview);
      padding: 14px;
    }
    #preview svg {
      display: block;
      width: 100%;
      height: auto;
      max-width: 900px;
      margin: 0 auto;
    }
    /* Paper, and the shadow that separates it from the desk, per page rather than on the whole
       document: separatePages() gaps the pages, and a background on the <svg> would fill the gaps
       back in. Typst paints no page background of its own unless the document sets a page fill. */
    #preview .typst-page-bg {
      fill: #fff;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.28));
    }

    /* --- Status bar --- */
    #statusbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 16px;
      background: var(--bg-toolbar);
      border-top: 1px solid var(--border-line);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    #status { color: inherit; }
    #status.error { color: var(--text-status-error); }
    #status.loading { color: var(--text-status-loading); }
    #statusbar .right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #unsaved-badge {
      display: none;
      align-items: center;
      gap: 5px;
    }
    #unsaved-badge.visible { display: inline-flex; }
    #unsaved-badge::before {
      content: "";
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--amber-2);
    }
    #recompile {
      font: inherit;
      font-weight: 700;
      color: var(--text-link);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    #recompile:disabled { opacity: 0.5; cursor: default; }

    /* --- Drop overlay --- */
    #drop-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-drop-overlay);
      border: 3px dashed var(--border-drop);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-drop);
      font-weight: 700;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }
    #drop-overlay.visible { opacity: 1; }

    :focus-visible { outline: 2.5px solid var(--blue); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    /* --- Mobile layout --- */
    @media (max-width: 768px) {
      #main { flex-direction: column; }
      /* Both panes split the leftover viewport. `flex: none` sized the editor to its content,
         so a long document pushed the preview off the bottom of the screen; `flex: 1 1 0` plus
         `min-height: 0` keeps each pane a fixed share and lets it scroll internally instead. */
      #editor-pane {
        border-right: none;
        border-bottom: 1.5px solid var(--border-edge);
        flex: 1 1 0;
        min-height: 0;
      }
      #preview-container { flex: 1 1 0; min-height: 0; }
      #toolbar { flex-wrap: wrap; gap: 8px; padding: 8px 12px; }
      #toolbar h1 { font-size: 14px; }
      .toolbar-spacer { display: none; }
      /* Drop the step chrome (numbers, arrows, "Write") so the toolbar stays one or two rows. */
      .steps { flex-wrap: wrap; gap: 6px; }
      .step-deco { display: none; }
      #template-select { max-width: 52vw; }
      /* Onboard moves into the ⋯ menu on mobile. */
      #onboard-agent { display: none; }
      .onboard-mobile { display: block; }
      /* Tighten the tab bar so tabs + actions fit one line at phone widths; it still wraps (right-aligned) if they can't. */
      #pane-tabs { flex-wrap: wrap; align-items: center; padding: 8px 10px 0; gap: 4px; }
      .tab { padding: 6px 10px; font-size: 12px; }
      .tab-actions { flex-wrap: wrap; gap: 5px; padding-bottom: 8px; }
      .tab-actions .btn { padding: 3px 8px; }
      .tab-actions select.btn { max-width: 104px; }
      /* Triggers sit at different x on mobile (⚙ right, ⋯ left), so pin the panel to the viewport instead of the trigger to stop it running off-screen. */
      .panel { position: fixed; left: 8px; right: 8px; top: auto; min-width: 0; max-width: none; }
      /* One finger pans (native scrolling); two fingers are the app's own zoom (main.ts), so the
         browser must not grab the pinch and zoom the whole UI. Also kills iOS double-tap page zoom. */
      #preview { touch-action: pan-x pan-y; }
      /* The maximize toggle floats over the preview's top-right corner. */
      #preview-max {
        display: grid;
        place-items: center;
        position: absolute;
        top: 10px;
        right: 10px;
        width: 40px;
        height: 40px;
        z-index: 10;
        font: inherit;
        font-size: 19px;
        font-weight: 700;
        color: var(--text-primary);
        background: var(--bg-toolbar);
        border: 1.5px solid var(--border-edge);
        border-radius: 10px;
        box-shadow: 0 2.5px 0 var(--border-edge);
        cursor: pointer;
      }
      #preview-max:active { transform: translateY(2px); box-shadow: 0 0.5px 0 var(--border-edge); }
      /* Maximized: the document gets the editor's half back. Toolbar and status bar stay, so
         Download PDF and the compile status remain reachable while maximized. */
      body.preview-maxed #editor-pane { display: none; }
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <span class="mark" aria-hidden="true"></span>
    <h1>typstmd</h1>
    <span class="steps">
      <span class="step-deco"><span class="stepn">1</span> Write</span>
      <span class="step-deco arrow" aria-hidden="true">→</span>
      <span class="step-deco stepn">2</span>
      <!-- Options come from the theme registry at runtime; a hardcoded list drifts. -->
      <!-- Themes, Universe packages and brought-in files are all templates: one picker, built at runtime. -->
      <span class="select-wrap"><select id="template-select" class="btn sec" aria-label="Pick a template: a built-in theme, a Typst Universe package, or one of yours"></select></span>
      <span class="step-deco arrow" aria-hidden="true">→</span>
      <span class="step-deco stepn">3</span>
      <a id="download-link" class="btn" href="#" download="typstmd.pdf" aria-disabled="true">Download PDF</a>
    </span>
    <div class="toolbar-spacer"></div>
    <button id="onboard-agent" class="btn sec onboard-trigger" type="button" title="Copy a prompt that onboards your coding agent (Claude, Codex, Cursor, OpenCode) to build a typstmd template">
      <span>Onboard your agent</span>

      </span>
    </button>
    <details class="pop" id="more-pop">
      <summary><span class="btn sec icon" role="button" aria-label="More actions" title="More actions">⋯</span></summary>
      <div class="panel">
        <!-- First in the menu: a newcomer with nothing to convert needs to see what the tool does before bringing a file to it. -->
        <button class="pitem" id="load-showcase" type="button" title="Load a full example document together with the template that styles it">
          Try the showcase
          <span class="hint">A full report, and the template that styles it</span>
        </button>
        <label class="pitem" for="template-file" title="Use any .typ file as the template">
          Bring your own .typ template
          <span class="hint">Any Typst file becomes a template</span>
        </label>
        <button class="pitem onboard-trigger onboard-mobile" type="button" title="Copy a prompt that onboards your coding agent (Claude, Codex, Cursor, OpenCode)">
          Onboard your agent
          <span class="hint">Copy a prompt for your coding agent</span>
        </button>
      </div>
    </details>
    <input id="template-file" type="file" accept=".typ" hidden>
    <button id="dark-toggle" class="btn sec icon" type="button" title="Toggle dark mode">🌙</button>
  </div>
  <div id="main">
    <div id="editor-pane">
      <div id="pane-tabs">
        <button id="tab-markdown" class="tab active" type="button">Markdown</button>
        <button id="tab-source" class="tab" type="button" title="The generated Typst document; changes with the template">Typst source</button>
        <span class="tab-actions">
          <button id="reset-template" class="btn sec" type="button" title="Reset template to its built-in default">Reset</button>
          <button id="edit-template" class="btn sec" type="button" title="Edit the Typst template for the current selection">Edit template</button>
          <span class="select-wrap"><select id="highlight-select" class="btn sec" title="Editor colors" aria-label="Editor colors"></select></span>
          <details class="pop" id="settings-pop">
            <summary><span class="btn sec icon" role="button" aria-label="Settings" title="Settings">⚙</span></summary>
            <div class="panel">
              <div id="hardbreaks-action">
                <h5>Document</h5>
                <label class="prow" title="On: a single Enter breaks the line. Off: needs a blank line, like standard Markdown">
                  <input type="checkbox" id="hard-breaks-toggle" class="brutal-check" checked>
                  <span>Enter = new line<span class="hint">Off: needs a blank line, like standard Markdown</span></span>
                </label>
              </div>
              <h5>Editor</h5>
              <label class="prow">
                <input type="checkbox" id="wrap-lines-toggle" class="brutal-check">
                <span>Wrap long lines</span>
              </label>
            </div>
          </details>
        </span>
      </div>
      <div id="editor-host"></div>
    </div>
    <div id="preview-container">
      <div id="preview" aria-label="Rendered document preview"></div>
      <!-- Mobile only (see the media query): page-fit leaves spare room, and the editor eats half
           the screen, so the phone gets a toggle that hands the whole viewport to the document. -->
      <button id="preview-max" type="button" aria-pressed="false" title="Maximize the preview">&#x2922;</button>
    </div>
  </div>
  <div id="statusbar">
    <span id="status" class="loading">Initializing WASM compiler...</span>
    <span class="right">
      <span id="unsaved-badge">Unsaved</span>
      <button id="recompile" type="button" title="Compiles automatically as you type; this forces a rebuild">Recompile</button>
    </span>
  </div>
  <div id="drop-overlay">Drop .md to load, .typ to use as the template, anything else as an image</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
